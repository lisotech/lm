<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zamlite Music - Fresh Hits & Audio</title>
    <style>
        :root {
            --primary-color: #ff3366;
            --bg-color: #e3f2fd;        /* Light blue background */
            --card-bg: #1e293b;        /* Dark grey card background */
            --text-color: #f1f5f9;     /* Light text for general elements */
            --section-title-color: #000000; /* Black color for section title */
            --text-muted: #94a3b8;     /* Muted grey text */
            --header-bg: #0f172a;      /* Dark header background */
            --border-color: #334155;   /* Dark border color */
            --search-bg: #334155;      /* Dark search background */
            --search-text: #f1f5f9;    /* Light search text */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Header */
        header {
            background-color: var(--header-bg);
            padding: 0.8rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
            gap: 0.5rem;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .logo {
            font-size: 1.15rem;
            font-weight: bold;
            color: var(--primary-color);
            text-decoration: none;
            white-space: nowrap;
        }

        .search-bar input {
            padding: 0.2rem 0.5rem;
            border-radius: 10px;
            border: none;
            outline: none;
            width: 110px;
            background-color: var(--search-bg);
            color: var(--search-text);
            font-size: 0.75rem;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .auth-nav-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0.3rem 0.7rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .auth-nav-btn:hover {
            opacity: 0.9;
        }

        /* Main Container */
        .container {
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1rem;
            flex: 1;
            width: 100%;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            position: relative;
        }

        .title-area {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        h2 {
            font-size: 1.3rem;
            border-left: 4px solid var(--primary-color);
            padding-left: 10px;
            color: var(--section-title-color);
        }

        .back-btn {
            background-color: var(--search-bg);
            color: var(--text-color);
            border: none;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            display: none;
        }

        .back-btn:hover {
            opacity: 0.8;
        }

        /* Music Grid - 3x3 layout */
        .music-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
        }

        .music-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem;
            text-align: center;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
        }

        .music-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.3);
        }

        .card-img-container {
            position: relative;
            width: 85px;
            height: 85px;
            margin-bottom: 0.6rem;
        }

        .card-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .card-content {
            display: flex;
            flex-direction: column;
            width: 100%;
            gap: 0.2rem;
            align-items: center;
        }

        .song-title {
            font-size: 0.95rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            color: var(--text-color);
        }

        .artist-name {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 0.4rem;
        }

        .action-buttons {
            display: flex;
            gap: 0.4rem;
            width: 100%;
            justify-content: center;
            margin-top: 0.3rem;
        }

        .player-btn, .download-btn {
            background-color: transparent;
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            text-align: center;
            text-decoration: none;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
            flex: 1;
        }

        .player-btn:hover, .download-btn:hover {
            background-color: var(--primary-color);
            color: white;
        }

        /* Admin action buttons on cards */
        .admin-card-actions {
            position: absolute;
            top: 6px;
            right: 6px;
            display: flex;
            gap: 4px;
            z-index: 10;
        }

        .admin-action-btn {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            font-size: 0.65rem;
            padding: 2px 5px;
            border-radius: 4px;
            cursor: pointer;
        }

        .admin-action-btn:hover {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
        }

        /* Dashboard panels */
        .dashboard-panel {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .dashboard-panel h3 {
            color: var(--text-color);
            margin-bottom: 1rem;
            font-size: 1.1rem;
        }

        .form-group {
            margin-bottom: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
            text-align: left;
        }

        .form-group label {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .form-group input, .form-group select {
            padding: 0.5rem;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            background-color: var(--search-bg);
            color: var(--search-text);
            font-size: 0.85rem;
        }

        .form-group input[type="file"] {
            padding: 0.3rem;
            font-size: 0.75rem;
            cursor: pointer;
        }

        .submit-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }

        .submit-btn:hover {
            opacity: 0.9;
        }

        /* Modal styling */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .modal-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.5rem;
            width: 320px;
            max-width: 90%;
            text-align: center;
            position: relative;
        }

        .modal-card h3 {
            margin-bottom: 1rem;
            color: var(--text-color);
            font-size: 1.2rem;
        }

        .close-modal {
            position: absolute;
            top: 10px;
            right: 15px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.2rem;
            cursor: pointer;
        }

        .password-container {
            position: relative;
            display: flex;
            align-items: center;
        }

        .password-container input {
            width: 100%;
            padding-right: 30px;
        }

        .eye-toggle {
            position: absolute;
            right: 8px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .toggle-auth-mode {
            background: none;
            border: none;
            color: var(--primary-color);
            cursor: pointer;
            font-size: 0.75rem;
            margin-top: 0.8rem;
            text-decoration: underline;
        }

        /* Footer Animation Styles - Compact Height */
        footer {
            background-color: #1e3a8a;
            border-top: 1px solid var(--border-color);
            text-align: center;
            padding: 0.5rem 1rem;
            font-size: 0.8rem;
            color: white;
            margin-top: 2rem;
            position: relative;
            overflow: hidden;
        }

        .footer-flowers-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }

        .falling-flower {
            position: absolute;
            top: -20px;
            font-size: 14px;
            user-select: none;
            animation: fallAnimation linear infinite;
        }

        @keyframes fallAnimation {
            0% {
                transform: translateY(-20px) rotate(0deg);
                opacity: 0.9;
            }
            100% {
                transform: translateY(80px) rotate(360deg);
                opacity: 0.2;
            }
        }

        .footer-content-inner {
            position: relative;
            z-index: 2;
        }

        footer p {
            margin-bottom: 0.2rem;
        }

        /* Responsive */
        @media(max-width: 768px) {
            .music-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media(max-width: 480px) {
            .music-grid {
                grid-template-columns: 1fr;
            }
            .logo {
                font-size: 1rem;
            }
            h2 {
                font-size: 1.1rem;
            }
        }
    </style>
</head>

            } catch (e) {
                console.error("Storage quota exceeded or error storing data:", e);

        function renderArtists(list) {
            const grid = document.getElementById('musicGrid');
            const title = document.getElementById('sectionTitle');
            const backBtn = document.getElementById('backBtn');
            
            title.innerText = "Albums and Tracks";
            backBtn.style.display = 'none';
            grid.innerHTML = '';
            
            if (list.length === 0) {
                grid.innerHTML = `<p style="grid-column: 1 / -1; text-align: center; color: var(--text-muted);">No artists found.</p>`;
                return;
            }

            list.forEach((artist, index) => {
                let adminCardControls = '';
                if (currentUser && currentUser.role === 'admin') {
                    let moveUpBtn = index > 0 ? `<button class="admin-action-btn" onclick="moveArtist(${index}, -1); event.stopPropagation();" title="Move Up">↑</button>` : '';
                    let moveDownBtn = index < list.length - 1 ? `<button class="admin-action-btn" onclick="moveArtist(${index}, 1); event.stopPropagation();" title="Move Down">↓</button>` : '';
                    let editArtistBtn = `<button class="admin-action-btn" onclick="openEditArtistModal(${index}); event.stopPropagation();">Edit</button>`;
                    let deleteArtistBtn = `<button class="admin-action-btn" onclick="deleteArtistProfile(${index}); event.stopPropagation();">Delete</button>`;

                    adminCardControls = `
                        <div class="admin-card-actions" style="display:flex; gap:2px; flex-wrap:wrap; max-width:85px; justify-content:flex-end;">
                            ${moveUpBtn}
                            ${moveDownBtn}
                            ${editArtistBtn}
                            ${deleteArtistBtn}
                        </div>
                    `;
                }

                grid.innerHTML += `
                    <div class="music-card" onclick="openArtistTracks('${artist.name}')">
                        ${adminCardControls}
                        <div class="card-img-container">
                            <img src="${artist.cover}" alt="${artist.name}">
                        </div>
                        <div class="card-content">
                            <div class="song-title" title="${artist.name}">${artist.name}</div>
                            <div class="artist-name">${artist.tracks.length} Track(s) Available</div>
                        </div>
                    </div>
                `;
            });
        }

        function moveArtist(index, direction) {
            const newIndex = index + direction;
            if (newIndex < 0 || newIndex >= artistsData.length) return;

            // Swap positions
            const temp = artistsData[index];
            artistsData[index] = artistsData[newIndex];
            artistsData[newIndex] = temp;

            saveAppData();
            renderArtists(artistsData);
        }

        function openEditArtistModal(index) {
            const artist = artistsData[index];
            const newName = prompt("Edit Artist / Category Name:", artist.name);
            if (newName && newName.trim() !== "") {
                artist.name = newName.trim();
                // Also update track artist name references if desired, or keep them separate
                saveAppData();
                renderArtists(artistsData);
            }
        }

        function deleteArtistProfile(index) {
            if (confirm(`Are you sure you want to delete the artist profile "${artistsData[index].name}" and all associated tracks?`)) {
                artistsData.splice(index, 1);
                saveAppData();
                renderArtists(artistsData);
            }
        }

        function openArtistTracks(artistName) {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio = null;
                currentPlayingBtn = null;
            }

            currentView = 'tracks';
            currentActiveArtist = artistName;
            const artist = artistsData.find(a => a.name === artistName);
            if (!artist) return;

            renderTracks(artist.name, artist.tracks);
        }

        function renderTracks(artistName, tracksList) {
            const grid = document.getElementById('musicGrid');
            const title = document.getElementById('sectionTitle');
            const backBtn = document.getElementById('backBtn');

            title.innerText = `${artistName} - Tracks`;
            backBtn.style.display = 'block';
            grid.innerHTML = '';

            if (tracksList.length === 0) {
                grid.innerHTML = `<p style="grid-column: 1 / -1; text-align: center; color: var(--text-muted);">No tracks found.</p>`;
                return;
            }

            tracksList.forEach((track, index) => {
                const audioId = `audio-${artistName}-${index}`.replace(/[^a-zA-Z0-9-_]/g, '');
                const artistIndex = artistsData.findIndex(a => a.name === artistName);
                const trackIndex = artistsData[artistIndex].tracks.findIndex(t => t.title === track.title && (t.audio === track.audio || t.zip === track.zip));

                let adminControls = '';
                if (currentUser && currentUser.role === 'admin') {
                    adminControls = `
                        <div class="admin-card-actions">
                            <button class="admin-action-btn" onclick="openEditModal(${artistIndex}, ${trackIndex}); event.stopPropagation();">Edit</button>
                            <button class="admin-action-btn" onclick="deleteTrack(${artistIndex}, ${trackIndex}); event.stopPropagation();">Delete</button>
                        </div>
                    `;
                }

                let actionButtonsHTML = '';
                if (track.audio) {
                    actionButtonsHTML = `
                        <audio id="${audioId}" src="${track.audio}"></audio>
                        <div class="action-buttons">
                            <button class="player-btn" id="btn-${audioId}" onclick="togglePlay('${audioId}')">Play ▶</button>
                            <a href="${track.audio}" download="${track.title}.mp3" class="download-btn">Download</a>
                        </div>
                    `;
                } else {
                    actionButtonsHTML = `
                        <div class="action-buttons">
                            <a href="${track.zip}" download="${track.title}.zip" class="download-btn" style="flex:1;">Download Zip Bundle</a>
                        </div>
                    `;
                }

                grid.innerHTML += `
                    <div class="music-card">
                        ${adminControls}
                        <div class="card-img-container">
                            <img src="${track.cover}" alt="${track.title}">
                        </div>
                        <div class="card-content">
                            <div class="song-title" title="${track.title}">${track.title}</div>
                            <div class="artist-name">${track.artist}</div>
                            ${actionButtonsHTML}
                        </div>
                    </div>
                `;
            });
        }

        function togglePlay(audioId) {
            const audioElem = document.getElementById(audioId);
            const btnElem = document.getElementById(`btn-${audioId}`);

            if (currentAudio && currentAudio !== audioElem) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
                if (currentPlayingBtn) {
                    currentPlayingBtn.innerText = "Play ▶";
                }
            }

            if (audioElem.paused) {
                audioElem.play().then(() => {
                    currentAudio = audioElem;
                    currentPlayingBtn = btnElem;
                    btnElem.innerText = "Pause ⏸";
                }).catch(e => {
                    alert("Audio source could not be played.");
                });
            } else {
                audioElem.pause();
                btnElem.innerText = "Play ▶";
                currentAudio = null;
                currentPlayingBtn = null;
            }

            audioElem.onended = function() {
                btnElem.innerText = "Play ▶";
                currentAudio = null;
                currentPlayingBtn = null;
            };
        }

        function resetView() {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio = null;
                currentPlayingBtn = null;
            }
            currentView = 'artists';
            currentActiveArtist = null;
            document.getElementById('searchInput').value = '';
            renderArtists(artistsData);
        }

        function globalSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const grid = document.getElementById('musicGrid');
            const title = document.getElementById('sectionTitle');
            const backBtn = document.getElementById('backBtn');

            if (query === "") {
                if (currentView === 'artists') {
                    renderArtists(artistsData);
                } else if (currentView === 'tracks' && currentActiveArtist) {
                    const artist = artistsData.find(a => a.name === currentActiveArtist);
                    if (artist) renderTracks(artist.name, artist.tracks);
                }
                return;
            }

            if (currentView === 'tracks' && currentActiveArtist) {
                const artist = artistsData.find(a => a.name === currentActiveArtist);
                if (artist) {
                    const filteredTracks = artist.tracks.filter(track => 
                        track.title.toLowerCase().includes(query) || 
                        track.artist.toLowerCase().includes(query)
                    );
                    renderTracks(artist.name, filteredTracks);
                }
                return;
            }

            currentView = 'global-search';
            title.innerText = `Search Results for "${query}"`;
            backBtn.style.display = 'block';
            grid.innerHTML = '';

            const matchingArtists = artistsData.filter(artist => 
                artist.name.toLowerCase().includes(query)
            );

            let matchingTracks = [];
            artistsData.forEach(artist => {
                artist.tracks.forEach(track => {
                    if (track.title.toLowerCase().includes(query) || track.artist.toLowerCase().includes(query)) {
                        matchingTracks.push(track);
                    }
                });
            });

            if (matchingArtists.length === 0 && matchingTracks.length === 0) {
                grid.innerHTML = `<p style="grid-column: 1 / -1; text-align: center; color: var(--text-muted);">No matching artists or tracks found.</p>`;
                return;
            }

            matchingArtists.forEach((artist) => {
                grid.innerHTML += `
                    <div class="music-card" onclick="openArtistTracks('${artist.name}')">
                        <div class="card-img-container">
                            <img src="${artist.cover}" alt="${artist.name}">
                        </div>
                        <div class="card-content">
                            <div class="song-title" title="${artist.name}">${artist.name}</div>
                            <div class="artist-name">Artist / Category</div>
                        </div>
                    </div>
                `;
            });

            matchingTracks.forEach((track, index) => {
                const audioId = `search-audio-${index}`;
                let actionButtonsHTML = '';
                if (track.audio) {
                    actionButtonsHTML = `
                        <audio id="${audioId}" src="${track.audio}"></audio>
                        <div class="action-buttons">
                            <button class="player-btn" id="btn-${audioId}" onclick="togglePlay('${audioId}')">Play ▶</button>
                            <a href="${track.audio}" download="${track.title}.mp3" class="download-btn">Download</a>
                        </div>
                    `;
                } else {
                    actionButtonsHTML = `
                        <div class="action-buttons">
                            <a href="${track.zip}" download="${track.title}.zip" class="download-btn" style="flex:1;">Download Zip Bundle</a>
                        </div>
                    `;
                }

                grid.innerHTML += `
                    <div class="music-card">
                        <div class="card-img-container">
                            <img src="${track.cover}" alt="${track.title}">
                        </div>
                        <div class="card-content">
                            <div class="song-title" title="${track.title}">${track.title}</div>
                            <div class="artist-name">${track.artist}</div>
                            ${actionButtonsHTML}
                        </div>
                    </div>
                `;
            });
        }

        /* Authentication & Dashboard Control Logic */
        function openAuthModal() {
            document.getElementById('authModal').style.display = 'flex';
        }

        function closeAuthModal() {
            document.getElementById('authModal').style.display = 'none';
        }

        function togglePasswordVisibility() {
            const pwdInput = document.getElementById('authPassword');
            pwdInput.type = pwdInput.type === 'password' ? 'text' : 'password';
        }

        function toggleAuthMode() {
            isRegisterMode = !isRegisterMode;
            document.getElementById('modalTitle').innerText = isRegisterMode ? 'Create Account' : 'Sign In';
            document.getElementById('authSubmitBtn').innerText = isRegisterMode ? 'Register' : 'Sign In';
            document.getElementById('toggleModeBtn').innerText = isRegisterMode ? 'Already have an account? Sign In' : 'Need an account? Register';
        }

        function submitAuthForm(event) {
            event.preventDefault();
            const username = document.getElementById('authUsername').value.trim();
            const password = document.getElementById('authPassword').value;

            // Check Admin Credentials
            if (username === 'lisotech' && password === 'Lisotech@1') {
                currentUser = { username: 'lisotech', role: 'admin' };
                localStorage.setItem('zamlite_current_user', JSON.stringify(currentUser));
                closeAuthModal();
                updateUIState();
                resetView();
                alert('Welcome Admin (Lisotech)!');
                return;
            }

            let savedUsers = JSON.parse(localStorage.getItem('zamlite_saved_users')) || [];

            if (isRegisterMode) {
                const existing = savedUsers.find(u => u.username === username);
                if (existing) {
                    alert('Username already exists. Please choose another or sign in.');
                    return;
                }
                const newUser = { username, password, role: 'client' };
                savedUsers.push(newUser);
                localStorage.setItem('zamlite_saved_users', JSON.stringify(savedUsers));
                currentUser = { username, role: 'client' };
                localStorage.setItem('zamlite_current_user', JSON.stringify(currentUser));
                closeAuthModal();
                updateUIState();
                resetView();
                alert('Account created and logged in successfully!');
            } else {
                const foundUser = savedUsers.find(u => u.username === username && u.password === password);
                if (foundUser) {
                    currentUser = { username: foundUser.username, role: 'client' };
                    localStorage.setItem('zamlite_current_user', JSON.stringify(currentUser));
                    closeAuthModal();
                    updateUIState();
                    resetView();
                    alert(`Welcome back, ${foundUser.username}!`);
                } else {
                    alert('Invalid username or password.');
                }
            }
        }

        function logoutUser() {
            currentUser = null;
            localStorage.removeItem('zamlite_current_user');
            updateUIState();
            resetView();
            alert('Logged out successfully.');
        }

        function updateUIState() {
            const authNavBtn = document.getElementById('authNavBtn');
            const dashboardContainer = document.getElementById('dynamicDashboardContainer');

            if (!currentUser) {
                authNavBtn.innerText = 'Sign In';
                authNavBtn.onclick = openAuthModal;
                dashboardContainer.innerHTML = '';
                return;
            }

            authNavBtn.innerText = 'Log Out';
            authNavBtn.onclick = logoutUser;

            if (currentUser.role === 'admin') {
                dashboardContainer.innerHTML = `
                    <div class="dashboard-panel">
                        <h3>Admin Control Dashboard (${currentUser.username})</h3>
                        <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.5rem;">Use the up/down arrows (↑ ↓) on landing page artist profiles to rearrange their display order, or edit/delete profiles and tracks directly.</p>
                    </div>
                `;
            } else if (currentUser.role === 'client') {
                dashboardContainer.innerHTML = `
                    <div class="dashboard-panel">
                        <h3>Client Upload Dashboard (${currentUser.username})</h3>
                        <form onsubmit="handleSongUpload(event)">
                            <div class="form-group">
                                <label>1. Music Category / Upload Type</label>
                                <select id="uploadType" required onchange="handleUploadTypeChange()">
                                    <option value="Single">Single</option>
                                    <option value="Album">Album</option>
                                    <option value="Mix">Mix</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>2. Artist Name</label>
                                <input type="text" id="uploadArtistName" required placeholder="Enter artist name">
                            </div>
                            <div class="form-group">
                                <label>3. Song Title / Release Name</label>
                                <input type="text" id="uploadTitle" required placeholder="Enter song or release title">
                            </div>
                            <div class="form-group" id="fileInputGroup">
                                <label id="fileInputLabel">4. Choose Audio File (mp3)</label>
                                <input type="file" id="uploadAudioFile" accept="audio/mp3,audio/*,.zip" required>
                                <small id="fileInputHint" style="color: var(--text-muted); font-size: 0.7rem; margin-top: 2px;">Allows 1 audio file (.mp3)</small>
                            </div>
                            <div class="form-group">
                                <label>5. Choose Cover Image</label>
                                <input type="file" id="uploadCoverFile" accept="image/*">
                            </div>
                            <button type="submit" class="submit-btn">Upload</button>
                        </form>
                    </div>
                `;
            }
        }

        function handleUploadTypeChange() {
            const type = document.getElementById('uploadType').value;
            const fileInput = document.getElementById('uploadAudioFile');
            const hint = document.getElementById('fileInputHint');
            const label = document.getElementById('fileInputLabel');

            if (type === 'Single') {
                label.innerText = '4. Choose Audio File (mp3)';
                fileInput.accept = 'audio/mp3,audio/*';
                fileInput.multiple = false;
                hint.innerText = 'Allows exactly 1 audio file (.mp3)';
            } else if (type === 'Album') {
                label.innerText = '4. Choose Audio Files (5 to 15 songs) or Zip File';
                fileInput.accept = 'audio/mp3,audio/*,.zip';
                fileInput.multiple = true;
                hint.innerText = 'Select between 5 to 15 mp3 files or a downloadable .zip archive';
            } else if (type === 'Mix') {
                label.innerText = '4. Choose Audio Files (1 to 20 songs) or Zip File';
                fileInput.accept = 'audio/mp3,audio/*,.zip';
                fileInput.multiple = true;
                hint.innerText = 'Select between 1 to 20 mp3 files or a downloadable .zip archive';
            }
        }

        function handleSongUpload(event) {
            event.preventDefault();
            const uploadType = document.getElementById('uploadType').value;
            const artistName = document.getElementById('uploadArtistName').value.trim();
            const songTitle = document.getElementById('uploadTitle').value.trim();
            const audioInput = document.getElementById('uploadAudioFile');
            const coverInput = document.getElementById('uploadCoverFile');

            if (!audioInput.files || audioInput.files.length === 0) {
                alert('Please select an audio file or archive.');
                return;
            }

            const files = audioInput.files;
            const coverFile = (coverInput.files && coverInput.files.length > 0) ? coverInput.files[0] : null;

            // Validate based on upload type rules
            if (uploadType === 'Single') {
                if (files.length !== 1) {
                    alert('Single category requires exactly 1 song file.');
                    return;
                }
            } else if (uploadType === 'Album') {
                const isZip = files.length === 1 && files[0].name.endsWith('.zip');
                if (!isZip && (files.length < 5 || files.length > 15)) {
                    alert('Album category requires between 5 to 15 songs or a single .zip file.');
                    return;
                }
            } else if (uploadType === 'Mix') {
                const isZip = files.length === 1 && files[0].name.endsWith('.zip');
                if (!isZip && (files.length < 1 || files.length > 20)) {
                    alert('Mix category requires between 1 to 20 songs or a single .zip file.');
                    return;
                }
            }

            if (coverFile) {
                let readerCover = new FileReader();
                readerCover.onload = function(coverEvent) {
                    const coverBase64 = coverEvent.target.result;
                    processFilesUpload(uploadType, artistName, songTitle, files, coverBase64);
                };
                readerCover.readAsDataURL(coverFile);
            } else {
                processFilesUpload(uploadType, artistName, songTitle, files, "albumcover.png");
            }
        }

        function processFilesUpload(uploadType, artistName, songTitle, files, coverBase64) {
            let processedTracks = [];
            let fileCount = files.length;

            if (fileCount === 1 && files[0].name.endsWith('.zip')) {
                let reader = new FileReader();
                reader.onload = function(e) {
                    const zipBase64 = e.target.result;
                    const newTrack = {
                        title: songTitle,
                        artist: artistName,
                        cover: coverBase64,
                        zip: zipBase64,
                        audio: null
                    };
                    saveCategoryData(artistName, [newTrack], coverBase64);
                };
                reader.readAsDataURL(files[0]);
                return;
            }

            let loadedCount = 0;
            for (let i = 0; i < fileCount; i++) {
                let file = files[i];
                let reader = new FileReader();
                reader.onload = function(e) {
                    processedTracks.push({
                        title: fileCount === 1 ? songTitle : (songTitle + " - Track " + (i + 1)),
                        artist: artistName,
                        cover: coverBase64,
                        audio: e.target.result
                    });
                    loadedCount++;
                    if (loadedCount === fileCount) {
                        saveCategoryData(artistName, processedTracks, coverBase64);
                    }
                };
                reader.readAsDataURL(file);
            }
        }

        function saveCategoryData(artistName, tracksList, coverBase64) {
            let artistObj = artistsData.find(a => a.name.toLowerCase() === artistName.toLowerCase());

            if (artistObj) {
                artistObj.tracks.push(...tracksList);
            } else {
                artistsData.push({
                    name: artistName,
                    cover: coverBase64,
                    tracks: tracksList
                });
            }

            saveAppData();
            alert('Upload successful and stored on the website!');
            resetView();
        }

        /* Admin Delete and Edit Functions */
        function deleteTrack(artistIndex, trackIndex) {
            if (confirm("Are you sure you want to delete this track?")) {
                artistsData[artistIndex].tracks.splice(trackIndex, 1);
                
                if (artistsData[artistIndex].tracks.length === 0) {
                    artistsData.splice(artistIndex, 1);
                    saveAppData();
                    resetView();
                } else {
                    saveAppData();
                    openArtistTracks(artistsData[artistIndex].name);
                }
            }
        }

        function openEditModal(artistIndex, trackIndex) {
            const track = artistsData[artistIndex].tracks[trackIndex];
            document.getElementById('editArtistIndex').value = artistIndex;
            document.getElementById('editTrackIndex').value = trackIndex;
            document.getElementById('editSongTitle').value = track.title;
            document.getElementById('editArtistName').value = track.artist;
            document.getElementById('editModal').style.display = 'flex';
        }

        function closeEditModal() {
            document.getElementById('editModal').style.display = 'none';
        }

        function handleEditTrack(event) {
            event.preventDefault();
            const artistIndex = parseInt(document.getElementById('editArtistIndex').value);
            const trackIndex = parseInt(document.getElementById('editTrackIndex').value);
            const newTitle = document.getElementById('editSongTitle').value.trim();
            const newArtist = document.getElementById('editArtistName').value.trim();

            artistsData[artistIndex].tracks[trackIndex].title = newTitle;
            artistsData[artistIndex].tracks[trackIndex].artist = newArtist;

            saveAppData();
            closeEditModal();
            alert('Track updated successfully!');
            openArtistTracks(artistsData[artistIndex].name);
        }

        function initFooterFlowers() {
            const container = document.getElementById('flowerContainer');
            if (!container) return;
            
            const flowerEmojis = ['🌸', '🌼', '🌺', '🌻']; 
            const flowerCount = 10;

            for (let i = 0; i < flowerCount; i++) {
                const span = document.createElement('span');
                span.className = 'falling-flower';
                span.innerText = flowerEmojis[Math.floor(Math.random() * flowerEmojis.length)];
                
                span.style.left = Math.random() * 100 + '%';
                span.style.animationDuration = (2.5 + Math.random() * 3) + 's';
                span.style.animationDelay = (Math.random() * 4) + 's';
                
                span.style.fontSize = (10 + Math.random() * 6) + 'px';
                
                container.appendChild(span);
            }
        }

        renderArtists(artistsData);
        initFooterFlowers();
        updateUIState();
    </script>
</body>
</html>
